<meta charset="utf-8">
<script src="gate.js"></script>
<title>DTA 2026 TA Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a reviewer's desk — nominee list on the left, the open file and score sheet on the right. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --sunk:#eef1f4; --ink:#17212b; --muted:#5a6573; --line:#dbe0e6;
  --accent:#28598a; --accent-soft:#e2ebf4; --on-accent:#ffffff;
  --gold:#a77a22; --gold-soft:#f6edd9; --good:#2e7a4d; --good-soft:#e2f1e8; --warn:#9a5c00; --warn-soft:#fbeedb; --crit:#ad2a22;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#161d25; --sunk:#121820; --ink:#e5eaf0; --muted:#97a2b0; --line:#2a3440;
  --accent:#86b4e2; --accent-soft:#1b2a3a; --on-accent:#0f141a;
  --gold:#e1b65e; --gold-soft:#2c2416; --good:#6fc493; --good-soft:#15291e; --warn:#f0a744; --warn-soft:#2d2112; --crit:#f2877f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#161d25; --sunk:#121820; --ink:#e5eaf0; --muted:#97a2b0; --line:#2a3440;
  --accent:#86b4e2; --accent-soft:#1b2a3a; --on-accent:#0f141a;
  --gold:#e1b65e; --gold-soft:#2c2416; --good:#6fc493; --good-soft:#15291e; --warn:#f0a744; --warn-soft:#2d2112; --crit:#f2877f;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:28px} h2{font-size:24px} h3{font-size:17px;font-family:var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.namebox{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13px;font-weight:700;color:var(--ink)}
.namebox input{width:min(320px,100%);font-size:16px;font-weight:500;background:var(--surface);border:2px solid var(--accent)}
.progress{min-width:220px;flex:0 1 320px;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.notice{border:1px solid var(--line);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px}

/* desk */
.desk{display:grid;grid-template-columns:240px minmax(280px,1.15fr) minmax(340px,0.95fr);gap:16px;align-items:start}
@media (max-width:1100px){.desk{grid-template-columns:220px minmax(0,1fr)}.viewer{grid-column:1 / -1;height:75vh}}
@media (max-width:820px){.desk{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column;max-height:calc(100vh - 180px);min-height:320px}
.viewer{display:flex;flex-direction:column;height:calc(100vh - 180px);min-height:480px;overflow:hidden;padding:0}
.viewer-bar{flex:0 0 auto;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.viewer iframe{flex:1 1 auto;width:100%;min-height:0;height:100%;border:0;background:#fff}
@media (max-width:820px){.list{max-height:46vh}.viewer{height:70vh}}
.list-tools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
input[type=search],input[type=url],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.items{overflow-y:auto;padding:6px}
.item{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
.item:hover{background:var(--sunk)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item.mismatch{box-shadow:inset 4px 0 0 var(--warn)}
.item.agree{box-shadow:inset 4px 0 0 var(--good)}
.pill.mismatch{background:var(--crit);color:#fff}
.pill.agree{background:var(--good-soft);color:var(--good)}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .dp{grid-column:1;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .st{grid-row:1 / span 2;grid-column:2}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.none{background:var(--sunk);color:var(--muted)}
.pill.prog{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--good-soft);color:var(--good)}

/* file */
.file{padding:20px;display:flex;flex-direction:column;gap:20px;min-width:0;max-height:calc(100vh - 180px);overflow:auto}
.file-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.packet{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:14px;display:flex;flex-direction:column;gap:10px}
.sections{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.section{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
.section:hover{border-color:var(--accent)}
.section.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.section .pg{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 14px;font-weight:600;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.flag{color:var(--crit);font-weight:600;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.crit{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.crit-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
details{font-size:14px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-weight:500;width:max-content}
details ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:70ch}
.scale{display:flex;flex-wrap:wrap;gap:6px}
.sc{min-width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sc.half{min-width:40px;color:var(--muted);font-size:13px}
.sc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sc.peer{box-shadow:inset 0 -3px 0 var(--gold)}
.sc.clash[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.peers{font-size:12.5px;color:var(--muted)}
.peers .bad{color:var(--crit);font-weight:700}
.peers .ok{color:var(--good);font-weight:700}
.sc.clear{font-family:var(--f-body);font-size:13px;color:var(--muted);border-style:dashed}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);max-width:470px}
.crit.overall{background:var(--gold-soft);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.totals{display:flex;flex-wrap:wrap;gap:12px}
.tot{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:140px}
.tot .v{font-size:24px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.saved{font-size:13px;color:var(--muted)}

/* results */
.results{padding:20px;display:flex;flex-direction:column;gap:20px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk);font-weight:600}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.mismatch td{background:var(--warn-soft)}
tr.agree td{background:var(--good-soft)}
.spark{display:inline-block;width:90px;height:8px;background:var(--sunk);border-radius:99px;position:relative;vertical-align:middle}
.spark i{position:absolute;top:0;height:8px;border-radius:99px;background:var(--accent);opacity:.55}
.spark b{position:absolute;top:-2px;width:3px;height:12px;background:var(--ink);border-radius:2px}
.empty{padding:24px;color:var(--muted);text-align:center}

/* live summary */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.tile .v{font-size:26px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hbs{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 36px auto;gap:10px;align-items:center;font-size:13.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hb-v{text-align:right;font-weight:600}
.hb-s{font-size:12px;white-space:nowrap}
.hist{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;height:170px;align-items:end;padding-top:6px}
.hcol{display:grid;grid-template-rows:auto 1fr auto;height:100%;align-items:end;justify-items:center;gap:4px}
.hbar{width:100%;max-width:64px;background:var(--accent);opacity:.8;border-radius:6px 6px 0 0;min-height:2px;align-self:end}
.hnum{font-size:13px;font-weight:600}
.hlab{font-size:12px;color:var(--muted);text-align:center}
.brief{white-space:pre-wrap;font-size:14.5px;line-height:1.6;max-width:75ch;border-left:3px solid var(--gold);padding-left:14px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:8px;vertical-align:middle;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:560px){.hb{grid-template-columns:minmax(0,1fr) 36px;}.hb-t,.hb-s{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Distinguished Teaching Award · Teaching Assistants · 2026</div>
      <h1>Nominee review</h1>
      <label class="namebox" for="reviewerName">Reviewer name
        <input id="reviewerName" type="text" placeholder="Type your name, then press Enter" aria-label="Reviewer name" autocomplete="name">
      </label>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div class="progress" aria-live="polite">
        <div class="row" style="justify-content:space-between"><span id="progText" class="muted">0 of 44 scored</span><span id="who" class="muted"></span></div>
        <div class="bar"><i id="progBar"></i></div>
      </div>
      <div class="row">
        <a class="btn" href="totals.html">Rubric totals</a>
        <button class="btn" id="downloadScores" type="button">Download CSV</button>
        <label class="btn" style="cursor:pointer">Add a reviewer's sheet<input id="importScores" type="file" accept=".tsv,.txt,.csv" hidden></label>
      </div>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section id="viewScore" class="desk">
    <aside class="panel list" aria-label="Nominees">
      <div class="list-tools">
        <input type="search" id="q" placeholder="Search name or department" aria-label="Search nominees">
        <div class="chips" role="group" aria-label="Filter by status">
          <button class="chip" data-f="all" aria-pressed="true">All</button>
          <button class="chip" data-f="none" aria-pressed="false">Not started</button>
          <button class="chip" data-f="prog" aria-pressed="false">In progress</button>
          <button class="chip" data-f="done" aria-pressed="false">Scored</button>
        </div>
      </div>
      <div class="items" id="items"></div>
    </aside>
    <article class="panel viewer" id="viewer" aria-label="Nomination packet"></article>
    <article class="panel file" id="file" aria-live="polite"></article>
  </section>
</div>

<script src="portal.js"></script>
<script src="sections.js"></script>
<script>
// ---------- State
const S = { sel: 0, mine: {}, uid: null, db: null, user: null, admin: false, canWrite: true,
  links: {}, all: [], book: {}, reviewer: "", filter: "all", q: "", tab: "score", dirty: false, saving: false, lastSaved: null, local: false, sectionPage: null };

function packetUrl(n){
  return "packets/" + encodeURIComponent(n.name + ".pdf");
}
function packetSrc(n){
  const base = (S.links[n.key] || packetUrl(n)).split("#")[0].split("?")[0];
  return S.sectionPage ? `${base}?p=${S.sectionPage}#page=${S.sectionPage}` : base;
}
function showSection(n, page){
  S.sectionPage = page;
  const frame = $("viewer").querySelector("iframe");
  if (frame) frame.src = packetSrc(n);
  document.querySelectorAll("#file .section").forEach(b => b.classList.toggle("on", b.dataset.page === String(page)));
}
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v); }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k)); return e; };
const fmt = v => v == null ? "–" : (Number.isInteger(v) ? String(v) : v.toFixed(1));

function entry(key) { return S.mine[key] || null; }
function critSum(e) { if (!e || !e.c) return null; const v = e.c.filter(x => typeof x === "number"); return v.length === 4 ? v.reduce((a,b)=>a+b,0) : null; }
function status(e) { if (!e) return "none"; const c = (e.c||[]).filter(x => typeof x === "number").length + (typeof e.o === "number" ? 1 : 0);
  return c === 0 && !e.notes ? "none" : c === 5 ? "done" : "prog"; }
const STATUS_LABEL = {none:"Not started", prog:"In progress", done:"Scored"};

// ---------- Scores saved in this browser, one set per reviewer name
function rebuildAll(){
  S.all = Object.entries(S.book).filter(([, v]) => v && v.s && Object.keys(v.s).length)
    .map(([name, v]) => ({id: name, name, s: v.s}));
}
function localLoad(){
  try {
    const book = JSON.parse(localStorage.getItem("dta26-book") || "null");
    if (book && typeof book === "object") S.book = book;
    S.reviewer = localStorage.getItem("dta26-reviewer") || "";
    const old = JSON.parse(localStorage.getItem("dta26-scores") || "null");
    if (old && S.reviewer && !S.book[S.reviewer]) S.book[S.reviewer] = {s: old, updatedAt: ""};
    if (!S.reviewer && old && Object.keys(old).length) { S.reviewer = "Reviewer"; S.book[S.reviewer] = {s: old, updatedAt: ""}; }
  } catch {}
  S.mine = (S.book[S.reviewer] && S.book[S.reviewer].s) ? JSON.parse(JSON.stringify(S.book[S.reviewer].s)) : {};
  rebuildAll();
  const input = $("reviewerName"); if (input && S.reviewer) input.value = S.reviewer;
}
function localSave(){
  const name = (S.reviewer || "Reviewer").trim() || "Reviewer";
  S.reviewer = name;
  S.book[name] = {s: JSON.parse(JSON.stringify(S.mine)), updatedAt: new Date().toISOString()};
  try {
    localStorage.setItem("dta26-book", JSON.stringify(S.book));
    localStorage.setItem("dta26-reviewer", name);
    localStorage.setItem("dta26-scores", JSON.stringify(S.mine));
  } catch {}
  rebuildAll();
  const input = $("reviewerName"); if (input && input.value.trim() !== name) input.value = name;
}
function setReviewer(name){
  const next = name.trim();
  if (!next || next === S.reviewer) return;
  if (S.reviewer) S.book[S.reviewer] = {s: JSON.parse(JSON.stringify(S.mine)), updatedAt: new Date().toISOString()};
  S.reviewer = next;
  S.mine = (S.book[next] && S.book[next].s) ? JSON.parse(JSON.stringify(S.book[next].s)) : {};
  localSave(); renderList(); renderFile();
}
function nomineeSpread(key){
  const totals = [];
  const seen = new Set();
  S.all.forEach(r => {
    const id = r.name || r.id; if (seen.has(id)) return; seen.add(id);
    const e = r.s && r.s[key]; if (status(e) !== "done") return;
    totals.push(critSum(e) + e.o);
  });
  if (S.reviewer && !seen.has(S.reviewer) && status(entry(key)) === "done") totals.push(critSum(entry(key)) + entry(key).o);
  if (totals.length < 2) return null;
  const lo = Math.min(...totals), hi = Math.max(...totals);
  return {lo, hi, gap: hi - lo, mismatch: hi - lo >= DISAGREE};
}
function peerScores(n, critId, idx){
  return S.all.map(r => {
    const id = r.name || r.id;
    if (id === S.reviewer || r.id === S.uid) return null;
    const e = r.s && r.s[n.key];
    const v = !e ? null : critId === "o" ? e.o : e.c?.[idx];
    return typeof v === "number" ? {name: id, v} : null;
  }).filter(Boolean);
}

// ---------- Rendering: list
function renderProgress(){
  const done = NOMINEES.filter(n => status(entry(n.key)) === "done").length;
  $("progText").textContent = `${done} of ${NOMINEES.length} scored`;
  $("progBar").style.width = (done / NOMINEES.length * 100) + "%";
}
function renderList(){
  const box = $("items"); box.textContent = "";
  const q = S.q.trim().toLowerCase();
  let shown = 0;
  NOMINEES.forEach((n, i) => {
    const st = status(entry(n.key));
    if (S.filter !== "all" && st !== S.filter) return;
    if (q && !(n.name.toLowerCase().includes(q) || n.dept.toLowerCase().includes(q) || n.div.toLowerCase().includes(q))) return;
    shown++;
    const tot = critSum(entry(n.key)); const o = entry(n.key)?.o;
    const spread = nomineeSpread(n.key);
    const mark = spread ? (spread.mismatch ? " mismatch" : " agree") : "";
    box.append(el("button", {class:"item" + mark, "aria-current": i === S.sel ? "true" : "false", onclick: () => select(i)},
      el("span", {class:"nm", text:n.name}),
      el("span", {class:"st"}, el("span", {class:"pill " + (spread && spread.mismatch ? "mismatch" : st), text: spread && spread.mismatch ? `Differ by ${spread.gap}` : st === "done" ? `${fmt(tot + o)} / 25` : STATUS_LABEL[st]})),
      el("span", {class:"dp", text:n.dept})));
  });
  if (!shown) box.append(el("div", {class:"empty", text:"No nominees match."}));
  renderProgress();
}

// ---------- Rendering: the open file
function packetSections(n){
  return (typeof SECTIONS !== "undefined" && SECTIONS[n.key]) || [];
}
function scaleFor(n, critId, idx){
  const e = entry(n.key); const cur = critId === "o" ? e?.o : e?.c?.[idx];
  const peers = peerScores(n, critId, idx);
  const peerVals = peers.map(p => p.v);
  const differ = peerVals.length && (cur == null || peerVals.some(v => v !== cur));
  const wrap = el("div", {class:"scale", role:"group", "aria-label": "Score"});
  STEPS.forEach(v => {
    const chosen = peers.some(p => p.v === v);
    const clash = cur === v && differ;
    wrap.append(el("button", {class: "sc" + (Number.isInteger(v) ? "" : " half") + (chosen ? " peer" : "") + (clash ? " clash" : ""),
      "aria-pressed": cur === v ? "true" : "false", "aria-label": `Score ${v}`, disabled: !S.canWrite,
      onclick: () => setScore(n, critId, idx, cur === v ? null : v)}, fmt(v)));
  });
  if (cur != null) wrap.append(el("button", {class:"sc clear", disabled: !S.canWrite, onclick: () => setScore(n, critId, idx, null)}, "Clear"));
  const who = peers.length ? el("div", {class:"peers"}, peers.map((p, i) => el("span", {}, i ? " · " : "", el("b", {class: p.v === cur ? "ok" : "bad", text: p.name}), " ", fmt(p.v)))) : null;
  return el("div", {}, wrap, el("div", {class:"ends"}, el("span", {text:"1 = lowest evidence"}), el("span", {text:"5 = highest evidence"})), who);
}
function critBlock(n, c, idx, extra){
  return el("section", {class: "crit" + (extra ? " overall" : "")},
    el("div", {class:"crit-head"}, el("h3", {text:c.title})),
    el("div", {class:"muted", style:"font-size:14px;max-width:70ch", text:c.sub}),
    el("details", {}, el("summary", {}, "What to look for"), el("ul", {}, c.guide.map(g => el("li", {text:g})))),
    scaleFor(n, c.id, idx));
}
function renderFile(){
  const n = NOMINEES[S.sel]; const f = $("file"); f.textContent = "";
  const e = entry(n.key); const cs = critSum(e); const o = e?.o;
  const link = S.links[n.key] || packetUrl(n);

  f.append(el("div", {class:"file-head"},
    el("div", {style:"display:flex;flex-direction:column;gap:6px;min-width:0"},
      el("div", {class:"eyebrow", text:`Nominee ${S.sel + 1} of ${NOMINEES.length}`}),
      el("h2", {text:n.name}),
      el("div", {class:"facts"},
        el("span", {}, el("b", {text:n.title})),
        el("span", {text:n.dept}),
        el("span", {text:n.div}))),
    el("div", {}, el("span", {class:"pill " + (nomineeSpread(n.key)?.mismatch ? "mismatch" : status(e)), text: nomineeSpread(n.key)?.mismatch ? "Scores differ" : STATUS_LABEL[status(e)]}))));

  const spread = nomineeSpread(n.key);
  if (spread && spread.mismatch) f.append(el("div", {class:"flag", text:`Reviewers differ by ${spread.gap} points (${fmt(spread.lo)}–${fmt(spread.hi)} out of 25).`}));

  const view = $("viewer");
  view.textContent = "";
  view.append(
    el("div", {class:"viewer-bar"}, "Nomination packet"),
    el("iframe", {title: n.name + " nomination packet", src: packetSrc(n)}));

  const sections = packetSections(n);
  const pk = el("div", {class:"packet"},
    el("div", {}, el("div", {style:"font-weight:600"}, "What is in the packet"),
      el("div", {class:"muted", style:"font-size:13px"}, `${n.pages} pages · ${n.art} of 5 artifacts · ${n.lor} of 3 letters of recommendation`)),
    el("div", {class:"sections"}, sections.map(([title, page]) => el("button", {
      type: "button", class: "section" + (page === (S.sectionPage || sections[0][1]) ? " on" : ""),
      "data-page": String(page), "aria-label": `${title}, page ${page}`,
      onclick: () => showSection(n, page)
    }, el("span", {text: title}), el("span", {class: "pg", text: `p. ${page}`})))));
  if (n.note) pk.append(el("div", {class:"flag", text:n.note}));
  if (S.admin) {
    const inp = el("input", {type:"url", id:"linkInput", placeholder:"Paste the shared-drive link to this packet", value: link || "", "aria-label":"Packet link"});
    pk.append(el("div", {class:"row"}, inp, el("button", {class:"btn", onclick: () => saveLink(n, inp.value.trim())}, "Save link")),
      el("div", {class:"muted", style:"font-size:12.5px"}, "Only you see this field. Reviewers see the packet beside the score sheet."));
  }
  f.append(pk);

  CRITERIA.forEach((c, i) => f.append(critBlock(n, c, i, false)));
  f.append(critBlock(n, OVERALL, 0, true));

  const notes = el("textarea", {id:"notes", rows:"4", placeholder:"Strengths, concerns, evidence you want to raise in discussion", disabled: !S.canWrite});
  notes.value = e?.notes || "";
  notes.addEventListener("input", () => { const cur = ensure(n.key); cur.notes = notes.value; touch(); });
  f.append(el("section", {class:"crit"}, el("h3", {}, el("label", {for:"notes"}, "Notes")), notes));

  f.append(el("div", {class:"totals"},
    el("div", {class:"tot"}, el("div", {class:"eyebrow", text:"Criteria total"}), el("div", {class:"v num", text: cs == null ? "–" : fmt(cs)}), el("div", {class:"muted", style:"font-size:12.5px", text:"out of 20"})),
    el("div", {class:"tot"}, el("div", {class:"eyebrow", text:"Overall rating"}), el("div", {class:"v num", text: fmt(o)}), el("div", {class:"muted", style:"font-size:12.5px", text:"out of 5"})),
    el("div", {class:"tot"}, el("div", {class:"eyebrow", text:"Total score"}), el("div", {class:"v num", text: cs == null || o == null ? "–" : fmt(cs + o)}), el("div", {class:"muted", style:"font-size:12.5px", text:"out of 25"}))));

  f.append(el("div", {class:"foot"},
    el("span", {class:"saved", id:"saved", text: saveText()}),
    el("div", {class:"row"},
      el("button", {class:"btn", disabled: S.sel === 0, onclick: () => select(S.sel - 1)}, "← Previous"),
      el("button", {class:"btn primary", disabled: S.sel === NOMINEES.length - 1, onclick: () => select(S.sel + 1)}, "Next nominee →"))));
}
function saveText(){
  if (!S.canWrite) return "View only";
  if (S.saving || S.dirty) return "Saving…";
  if (S.local) return `Saved for ${S.reviewer || "you"} in this browser`;
  return S.lastSaved ? `Saved ${S.lastSaved.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}` : "Scores save automatically";
}
function select(i){ if (i !== S.sel) S.sectionPage = null; S.sel = i; renderList(); renderFile(); try { localStorage.setItem("dta26-sel", String(i)); } catch {} window.scrollTo({top:0}); }

// ---------- Editing and saving
function ensure(key){ return S.mine[key] || (S.mine[key] = {c:[null,null,null,null], o:null, notes:""}); }
function setScore(n, critId, idx, v){
  const e = ensure(n.key);
  if (critId === "o") e.o = v; else e.c[idx] = v;
  touch(); renderList(); renderFile();
}
let saveTimer = null;
function touch(){
  const k = NOMINEES[S.sel].key; ensure(k).t = new Date().toISOString();
  S.dirty = true; const s = $("saved"); if (s) s.textContent = saveText();
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!S.dirty) return;
  if (S.saving) { saveTimer = setTimeout(flush, 400); return; }
  S.dirty = false; S.saving = true;
  try {
    if (S.db && S.uid) { await S.db.doc("scores/" + S.uid).set({s: S.mine, updatedAt: new Date().toISOString()}); S.local = false; }
    else { localSave(); S.local = true; }
    S.lastSaved = new Date();
  } catch (err) {
    if (err && err.code === "invalid_argument") { S.canWrite = false; showNotice("Your access to this page is view-only, so scores can't be saved. Ask the coordinator to give you Contributor access."); renderFile(); }
    else { S.dirty = true; showNotice("Couldn't save just now. Your scores are kept on this page and will save on your next change."); }
  } finally { S.saving = false; const s = $("saved"); if (s) s.textContent = saveText(); }
}
async function saveLink(n, url){
  if (url && !/^https:\/\//i.test(url)) { showNotice("Packet links must start with https://"); return; }
  const next = {...S.links}; if (url) next[n.key] = url; else delete next[n.key];
  try { await S.db.doc("packets/links").set({links: next}); S.links = next; hideNotice(); renderFile(); }
  catch { showNotice("Couldn't save the packet link. Try again in a moment."); }
}
function showNotice(t){ const b = $("notice"); b.textContent = t; b.hidden = false; }
function hideNotice(){ $("notice").hidden = true; }

function parseCsvRow(line){
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === "," || ch === "\t") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function cell(v){ const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function reviewerRows(){
  const shared = (S.all || []).filter(d => d.s && Object.keys(d.s).length);
  if (shared.length) return shared.map(d => ({name: d.name || d.id, s: d.s}));
  return [{name: S.reviewer || "Reviewer", s: S.mine}];
}
function scoreSheetText(){
  const reviewers = reviewerRows();
  const head = ["Reviewer","Nominee","Department","Division","Title","Packet pages","Artifacts","Letters of recommendation","Packet note","Effective teaching practices","Learning environment","Impact on students or peers","Efforts to improve teaching","Criteria total","Overall rating","Total","Notes","Complete"];
  const lines = [head.join(",")];
  const byNominee = NOMINEES.map(n => ({n, done: []}));
  reviewers.forEach(r => NOMINEES.forEach((n, i) => {
    const e = r.s[n.key];
    const cs = critSum(e); const o = e && typeof e.o === "number" ? e.o : null;
    const total = cs != null && o != null ? cs + o : null;
    const done = status(e) === "done";
    if (done) byNominee[i].done.push({name: r.name, total, notes: e.notes || ""});
    lines.push([r.name, n.name, n.dept, n.div, n.title, n.pages, n.art, n.lor, n.note,
      e?.c?.[0] ?? "", e?.c?.[1] ?? "", e?.c?.[2] ?? "", e?.c?.[3] ?? "",
      cs ?? "", o ?? "", total ?? "", e?.notes || "", done ? "yes" : ""].map(cell).join(","));
  }));
  lines.push("", "Mismatches", "A mismatch is two or more finished reviews of the same nominee whose totals differ by 4 or more points out of 25.",
    ["Nominee","Department","Finished reviews","Lowest total","Highest total","Gap","Reviewer notes"].join(","));
  let flags = 0;
  byNominee.forEach(({n, done}) => {
    if (done.length < 2) return;
    const totals = done.map(d => d.total);
    const lo = Math.min(...totals), hi = Math.max(...totals);
    if (hi - lo < DISAGREE) return;
    flags++;
    lines.push([n.name, n.dept, done.length, lo, hi, hi - lo, done.map(d => `${d.name}: ${d.notes}`).filter(t => !t.endsWith(": ")).join(" | ")].map(cell).join(","));
  });
  if (!flags) lines.push("None");
  return lines.join("\n");
}
function downloadScoreSheet(){
  const blob = new Blob(["\uFEFF" + scoreSheetText()], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "DTA-2026-TA-score-sheet.csv";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function exportCsv(){ downloadScoreSheet(); }
function importScoreSheet(file){
  const reader = new FileReader();
  reader.onload = () => {
    const lines = String(reader.result || "").split(/\r?\n/).map(l => l.trimEnd()).filter(l => l && !l.startsWith("#") && l !== "Mismatches" && !l.startsWith("A mismatch"));
    if (!lines.length) { showNotice("That file has no scores."); return; }
    const head = parseCsvRow(lines[0]);
    const col = name => head.indexOf(name);
    const iRev = col("Reviewer"), iNom = col("Nominee");
    const iC = ["Effective teaching practices","Learning environment","Impact on students or peers","Efforts to improve teaching"].map(col);
    const iO = col("Overall rating"), iNotes = col("Notes");
    if (iRev < 0 || iNom < 0) { showNotice("That file is not a score sheet."); return; }
    const num = s => s === "" || s == null ? null : Number(s);
    const names = new Set();
    lines.slice(1).forEach(line => {
      const c = parseCsvRow(line);
      const reviewer = (c[iRev] || "").trim();
      const nominee = (c[iNom] || "").trim();
      if (!reviewer || !nominee || reviewer === "None") return;
      const key = nominee.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      if (!NOMINEES.some(n => n.key === key)) return;
      const rec = S.book[reviewer] || {s: {}, updatedAt: ""};
      rec.s[key] = {c: iC.map(i => i < 0 ? null : num(c[i])), o: iO < 0 ? null : num(c[iO]), notes: iNotes >= 0 ? (c[iNotes] || "") : "", t: new Date().toISOString()};
      rec.updatedAt = new Date().toISOString();
      S.book[reviewer] = rec;
      names.add(reviewer);
    });
    if (S.reviewer && S.book[S.reviewer]) S.mine = JSON.parse(JSON.stringify(S.book[S.reviewer].s));
    localSave(); renderList(); renderFile();
    showNotice(names.size ? `Stored scores for ${[...names].join(", ")}. Differences of 4 or more points are marked in red.` : "No scores were found in that file.");
  };
  reader.readAsText(file);
}

// ---------- Tabs and filters
$("downloadScores").onclick = downloadScoreSheet;
$("reviewerName").addEventListener("change", e => setReviewer(e.target.value));
$("importScores").addEventListener("change", e => { const file = e.target.files && e.target.files[0]; e.target.value = ""; if (file) importScoreSheet(file); });
$("q").addEventListener("input", e => { S.q = e.target.value; renderList(); });
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  S.filter = c.dataset.f; document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c)); renderList(); }));

// ---------- Boot: render at once, then connect to shared saving
localLoad();
try { const v = parseInt(localStorage.getItem("dta26-sel"), 10); if (v >= 0 && v < NOMINEES.length) S.sel = v; } catch {}
renderList(); renderFile();

(async () => {
  const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
  S.db = db; S.user = user;
  const uid = user ? await user.id() : null;
  if (!db || !uid) {
    S.local = true;
    if (!S.reviewer) showNotice("Enter a reviewer name above, then press Enter. Scores are saved in this browser under that name.");
    else hideNotice();
    renderList(); renderFile();
    return;
  }
  S.uid = uid;
  const me = await user.me(); $("who").textContent = me.name ? `Signed in as ${me.name}` : "";
  S.admin = await user.canEdit();

  let first = true;
  db.doc("scores/" + uid).onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (first || (!S.dirty && !S.saving)) { const d = snap.exists ? snap.data() : null; S.mine = d && d.s ? JSON.parse(JSON.stringify(d.s)) : {}; first = false; renderList(); renderFile(); }
  }, () => showNotice("Lost the connection to saved scores. Reload the page to reconnect."));
  db.doc("packets/links").onSnapshot(snap => { const d = snap.exists ? snap.data() : null; S.links = (d && d.links) || {}; if (S.tab === "score") renderFile(); });
  if (S.admin) db.collection("scores").onSnapshot(qs => {
    S.all = qs.docs.map(d => ({id:d.id, name:d.id, s:(d.data() || {}).s || {}}));
    S.lastSync = new Date();
    renderList();
    const active = document.activeElement;
    if (active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT")) return;
    renderFile();
  });
})();
</script>
