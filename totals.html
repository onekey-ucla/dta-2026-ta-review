<meta charset="utf-8">
<title>DTA 2026 TA Review — Rubric totals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f4f6f8; --surface:#ffffff; --sunk:#eef1f4; --ink:#17212b; --muted:#5a6573; --line:#dbe0e6;
  --accent:#28598a; --accent-soft:#e2ebf4; --on-accent:#ffffff;
  --gold:#a77a22; --good:#2e7a4d; --good-soft:#e2f1e8; --warn:#9a5c00; --warn-soft:#fbeedb; --crit:#ad2a22;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#161d25; --sunk:#121820; --ink:#e5eaf0; --muted:#97a2b0; --line:#2a3440;
  --accent:#86b4e2; --accent-soft:#1b2a3a; --on-accent:#0f141a;
  --gold:#e1b65e; --good:#6fc493; --good-soft:#15291e; --warn:#f0a744; --warn-soft:#2d2112; --crit:#f2877f;
  color-scheme:dark }}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;
  padding:20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.2}
h1{font-size:28px} h3{font-size:17px;font-family:var(--f-body)}
a{color:var(--accent)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.namebox{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13px;font-weight:700}
.namebox input{width:min(320px,100%);font-size:16px;font-weight:500;background:var(--surface);border:2px solid var(--accent);color:var(--ink);border-radius:8px;padding:8px 10px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;border-radius:8px;padding:8px 14px;font-weight:600;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.tile .v{font-size:26px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface)}
.hbs{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 36px auto;gap:10px;align-items:center;font-size:13.5px}
.hb-t{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hb-v{text-align:right;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk);font-weight:600}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.mismatch td{background:var(--warn-soft)}
tr.agree td{background:var(--good-soft)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.pill.mismatch{background:var(--crit);color:#fff}
.empty{padding:24px;color:var(--muted);text-align:center}
.bar{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:block;width:160px}
td.notes{white-space:normal;min-width:200px}
.who{display:flex;flex-direction:column;gap:2px}
.who b{font-weight:600}
.num.bad{color:var(--crit);font-weight:700}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Distinguished Teaching Award · Teaching Assistants · 2026</div>
      <h1>Rubric totals</h1>
      <label class="namebox" for="reviewerName">Reviewer name
        <input id="reviewerName" type="text" placeholder="Type your name, then press Enter" aria-label="Reviewer name" autocomplete="name">
      </label>
    </div>
    <a class="btn" href="index.html">Back to scoring</a>
  </header>
  <p class="muted" id="blurb">Totals from the scores saved in this browser. A row turns red when two finished reviews differ by 4 or more points out of 25.</p>
  <div id="out"></div>
</div>

<script src="portal.js"></script>
<script>
const fmt = v => v == null ? "–" : (Number.isInteger(v) ? String(v) : v.toFixed(1));
const r1 = v => v == null ? null : Math.round(v * 10) / 10;
const mean = a => a.length ? a.reduce((p,q)=>p+q,0) / a.length : null;
function critSum(e){ if (!e || !e.c) return null; const v = e.c.filter(x => typeof x === "number"); return v.length === 4 ? v.reduce((a,b)=>a+b,0) : null; }
function status(e){ if (!e) return "none"; const c = (e.c||[]).filter(x => typeof x === "number").length + (typeof e.o === "number" ? 1 : 0);
  return c === 0 && !e.notes ? "none" : c === 5 ? "done" : "prog"; }
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v === true ? "" : v); }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k)); return e; };

function reviewers(){
  let book = {};
  try { book = JSON.parse(localStorage.getItem("dta26-book") || "{}") || {}; } catch {}
  return Object.entries(book).filter(([,v]) => v && v.s && Object.keys(v.s).length).map(([name, v]) => ({name, s: v.s}));
}
function summary(people){
  const rows = NOMINEES.map(n => {
    const done = people.map(r => ({name:r.name, e:r.s[n.key]})).filter(x => status(x.e) === "done");
    const totals = done.map(x => critSum(x.e) + x.e.o);
    return { n, done, count: done.length, crit: mean(done.map(x => critSum(x.e))), overall: mean(done.map(x => x.e.o)),
      total: mean(totals), lo: totals.length ? Math.min(...totals) : null, hi: totals.length ? Math.max(...totals) : null };
  }).sort((a,b) => (b.total ?? -1) - (a.total ?? -1) || a.n.name.localeCompare(b.n.name));
  const allDone = rows.flatMap(r => r.done.map(x => x.e));
  return { rows, allDone, people,
    critAvg: [0,1,2,3].map(i => mean(allDone.map(e => e.c[i]))), overallAvg: mean(allDone.map(e => e.o)),
    flagged: rows.filter(r => r.count > 1 && r.hi - r.lo >= DISAGREE) };
}
function tile(label, value, sub){
  return el("div", {class:"tile"}, el("div", {class:"eyebrow", text:label}), el("div", {class:"v num", text:value}), sub ? el("div", {class:"muted", style:"font-size:12.5px", text:sub}) : null);
}
function hbar(label, v, max, sub){
  return el("div", {class:"hb"}, el("span", {text:label}),
    el("span", {class:"hb-t"}, el("i", {style:`width:${v == null ? 0 : v / max * 100}%`})),
    el("span", {class:"hb-v num", text: v == null ? "–" : fmt(r1(v))}), sub ? el("span", {class:"muted", text:sub}) : null);
}
function render(){
  const people = reviewers();
  const sm = summary(people);
  const box = $("out"); box.textContent = "";
  const scoredOnce = sm.rows.filter(r => r.count >= 1).length, scoredTwice = sm.rows.filter(r => r.count >= 2).length;
  box.append(el("div", {class:"tiles"},
    tile("Reviewers", String(people.length)),
    tile("Completed reviews", String(sm.allDone.length)),
    tile("Nominees reviewed", `${scoredOnce} / ${NOMINEES.length}`, `${scoredTwice} by 2 or more`),
    tile("Average total", sm.allDone.length ? fmt(r1(mean(sm.allDone.map(e => critSum(e) + e.o)))) : "–", "out of 25"),
    tile("Mismatches", String(sm.flagged.length), "differ by 4 or more")));
  if (!people.length) { box.append(el("div", {class:"empty", text:"No scores saved in this browser yet. Score nominees first, then reopen this page."})); return; }
  const divs = [...new Set(NOMINEES.map(n => n.div))].map(d => {
    const rs = sm.rows.filter(r => r.n.div === d); const t = rs.filter(r => r.total != null);
    return { d, n: rs.length, reviewed: t.length, avg: mean(t.map(r => r.total)) };
  }).sort((a,b) => (b.avg ?? -1) - (a.avg ?? -1));
  box.append(el("div", {class:"two"},
    el("section", {class:"card"}, el("h3", {text:"Average by criterion"}),
      el("div", {class:"hbs"}, CRITERIA.map((c, i) => hbar(c.title.replace(/^\d\.\s*/, ""), sm.critAvg[i], 5)), hbar("Overall rating", sm.overallAvg, 5))),
    el("section", {class:"card"}, el("h3", {text:"Average total by division"}),
      el("div", {class:"hbs"}, divs.map(d => hbar(d.d, d.avg, 25, `${d.reviewed}/${d.n}`))))));
  const tb = el("tbody");
  sm.rows.forEach((r, i) => {
    const disagree = r.count > 1 && r.hi - r.lo >= DISAGREE;
    tb.append(el("tr", {class: disagree ? "mismatch" : (r.count > 1 ? "agree" : "")},
      el("td", {class:"r num", text: r.total == null ? "" : String(i + 1)}),
      el("td", {}, el("a", {href:"index.html", text:r.n.name})),
      el("td", {class:"muted", text:r.n.dept}),
      el("td", {class:"r num", text:String(r.count)}),
      el("td", {class:"r num", text:fmt(r1(r.crit))}),
      el("td", {class:"r num", text:fmt(r1(r.overall))}),
      el("td", {class:"r num", style:"font-weight:700", text:fmt(r1(r.total))}),
      el("td", {class:"num", text: r.total == null ? "" : `${fmt(r.lo)}–${fmt(r.hi)}`}),
      el("td", {}, r.done.length ? el("div", {class:"who"}, r.done.map(x => el("div", {},
        el("b", {text:x.name}), " ", el("span", {class:"num" + (disagree ? " bad" : ""), text:fmt(critSum(x.e) + x.e.o)})))) : ""),
      el("td", {}, disagree ? el("span", {class:"pill mismatch", text:`Differ by ${r.hi - r.lo}`}) : "")));
  });
  box.append(el("h3", {text:"Ranking"}), el("div", {class:"tablewrap"}, el("table", {},
    el("thead", {}, el("tr", {}, ["#","Nominee","Department","Reviews","Criteria /20","Overall /5","Total /25","Range","Reviewer totals",""].map((h,i) =>
      el("th", {class:[0,3,4,5,6].includes(i) ? "r" : null, text:h})))), tb)));
  const detail = el("tbody");
  const flagged = new Set(sm.flagged.map(r => r.n.key));
  NOMINEES.forEach(n => {
    people.forEach(p => {
      const e = p.s[n.key]; if (!e) return;
      const any = (e.c || []).some(x => typeof x === "number") || typeof e.o === "number" || (e.notes && e.notes.trim());
      if (!any) return;
      const done = status(e) === "done";
      const cs = critSum(e);
      detail.append(el("tr", {class: flagged.has(n.key) ? "mismatch" : ""},
        el("td", {}, el("b", {text:p.name})),
        el("td", {}, el("a", {href:"index.html", text:n.name})),
        el("td", {class:"muted", text:n.dept}),
        el("td", {class:"r num", text:fmt(e.c?.[0])}),
        el("td", {class:"r num", text:fmt(e.c?.[1])}),
        el("td", {class:"r num", text:fmt(e.c?.[2])}),
        el("td", {class:"r num", text:fmt(e.c?.[3])}),
        el("td", {class:"r num", text:fmt(cs)}),
        el("td", {class:"r num", text:fmt(e.o)}),
        el("td", {class:"r num", style:"font-weight:700", text: done ? fmt(cs + e.o) : "–"}),
        el("td", {class:"notes", text:e.notes || ""})));
    });
  });
  box.append(el("h3", {text:"Every score"}), el("div", {class:"muted", text:"Each reviewer’s name, the four criteria, overall rating, total, and notes."}),
    detail.childNodes.length ? el("div", {class:"tablewrap"}, el("table", {},
      el("thead", {}, el("tr", {}, ["Reviewer","Nominee","Department","Teaching","Environment","Impact","Improve","Criteria /20","Overall /5","Total /25","Notes"].map((h,i) =>
        el("th", {class:[3,4,5,6,7,8,9].includes(i) ? "r" : null, text:h})))), detail))
      : el("div", {class:"empty", text:"No individual scores yet."}));
  const prog = el("tbody");
  people.forEach(r => {
    const d = NOMINEES.filter(n => status(r.s[n.key]) === "done").length;
    prog.append(el("tr", {}, el("td", {text:r.name}), el("td", {class:"r num", text:`${d} / ${NOMINEES.length}`}),
      el("td", {}, el("span", {class:"bar"}, el("i", {style:`width:${d / NOMINEES.length * 100}%`})))));
  });
  box.append(el("h3", {text:"Reviewer progress"}), el("div", {class:"tablewrap"}, el("table", {},
    el("thead", {}, el("tr", {}, el("th", {text:"Reviewer"}), el("th", {class:"r", text:"Scored"}), el("th", {text:""}))), prog)));
}
render();
window.addEventListener("storage", render);
const nameInput = $("reviewerName");
nameInput.value = localStorage.getItem("dta26-reviewer") || "";
nameInput.addEventListener("change", () => {
  const name = nameInput.value.trim();
  if (!name) return;
  localStorage.setItem("dta26-reviewer", name);
  let book = {};
  try { book = JSON.parse(localStorage.getItem("dta26-book") || "{}") || {}; } catch {}
  if (!book[name]) book[name] = {s: {}, updatedAt: new Date().toISOString()};
  localStorage.setItem("dta26-book", JSON.stringify(book));
});
</script>
